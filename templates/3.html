<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная карта России</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        #map {
            height: 600px; /* Высота карты уменьшена */
            border: 2px solid #007bff; /* Обводка вокруг карты */
            border-radius: 5px; /* Скругление углов */
            margin: 20px; /* Отступ вокруг карты */
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // Инициализация карты
        var map = L.map('map').setView([60.0, 100.0], 3); // Центр России

        // Добавление слоя карты
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Список городов и их координаты
        var cities = [
            { name: 'Москва', coords: [55.7558, 37.6173] },
            { name: 'Уфа', coords: [54.7388, 55.9721] },
            { name: 'Владивосток', coords: [43.1155, 131.8855] }
        ];

        // Добавление маркеров для каждого города
        cities.forEach(function(city) {
            var marker = L.marker(city.coords).addTo(map);
            marker.bindPopup(`<b>${city.name}</b><br><a href="/info_city/${city.name}">Информация о городе</a>`);
        });
    </script>
</body>
</html>
